spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      # Fail a request after 5 s when no connection is available (database down), not the 30 s default.
      connection-timeout: 5000
      # A transfer waiting on a row lock gives up after 5 s (the client retries) instead of holding a pooled
      # connection for as long as the lock holder lives. Without it, one crashed node's open transactions starved
      # every other pod's pool on GKE.
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  mvc:
    # Errors are returned as RFC 7807 application/problem+json.
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # A new consumer group starts from the oldest event, so a fresh statement view sees full history.
      auto-offset-reset: earliest

ledger:
  outbox:
    poll-interval-ms: 500

management:
  metrics:
    distribution:
      # Histogram buckets let Prometheus compute p95 and 'share of requests under 300 ms' across all pods.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 300ms
  endpoint:
    health:
      # Liveness/readiness groups everywhere, not only when Spring detects Kubernetes (tests, local runs).
      probes:
        enabled: true
      group:
        # Not ready without the database: Kubernetes stops routing to the pod instead of it returning 500s.
        # Liveness stays independent, so a database outage never restarts pods.
        readiness:
          include: readinessState, db
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema); MDC values like requestId become fields.
      console: ecs
