spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  mvc:
    # Errors are returned as RFC 7807 application/problem+json.
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # A new consumer group starts from the oldest event, so a fresh statement view sees full history.
      auto-offset-reset: earliest

ledger:
  outbox:
    poll-interval-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema); MDC values like requestId become fields.
      console: ecs
