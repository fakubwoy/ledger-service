services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      retries: 10

  # Single-node KRaft broker; the image defaults advertise localhost:9092.
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"

volumes:
  pgdata:
